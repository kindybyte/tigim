<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="55%" stop-color="#0E1F38"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.18" cy="0.25" r="0.45">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.88" cy="0.78" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#22324C" stroke-width="1"/>

  <!-- Logo block -->
  <g transform="translate(80, 90)">
    <rect width="76" height="76" rx="18" fill="url(#logoBg)"/>
    <path d="M19 26h38 M27 26v26 M49 26v26" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round"/>
    <circle cx="38" cy="52" r="4.5" fill="#BFDBFE"/>
    <text x="100" y="52" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#F1F5F9">Tigim</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">
      <tspan x="0" y="0">Контроль швейного</tspan>
      <tspan x="0" y="90" fill="url(#accent)">производства</tspan>
      <tspan x="0" y="180">в одном месте</tspan>
    </text>
  </g>

  <!-- Subtext -->
  <text x="80" y="540" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#94A3B8" font-weight="500">
    Заказы · Склад · Брак · Сотрудники · Финансы · ИИ-помощник
  </text>

  <!-- Bottom-right tag -->
  <g transform="translate(900, 530)">
    <rect width="220" height="44" rx="22" fill="#16243A" stroke="#3B82F6" stroke-opacity="0.4"/>
    <circle cx="22" cy="22" r="4" fill="#22D3EE"/>
    <text x="36" y="29" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#CBD5E1">
      Для цехов СНГ
    </text>
  </g>
</svg>
