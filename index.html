<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1628" />

    <!-- Primary SEO -->
    <title>Tigim — контроль швейного производства в одном месте</title>
    <meta
      name="description"
      content="SaaS для швейных цехов Кыргызстана и СНГ. Заказы, этапы производства, склад тканей и фурнитуры, брак, сотрудники, зарплаты и финансы — всё в одной системе. 14 дней бесплатно."
    />

      name="keywords"
      content="швейный цех, управление производством, CRM для швейного цеха, учёт заказов, склад тканей, контроль брака, Кыргызстан, СНГ, Tigim"
    />
    <meta name="author" content="Tigim" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tigim.vercel.app/" />

    <!-- Open Graph / Facebook / Telegram / WhatsApp / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tigim" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="ru_KG" />
    <meta property="og:locale:alternate" content="ru_KZ" />
    <meta property="og:url" content="https://tigim.vercel.app/" />
    <meta property="og:title" content="Tigim — контроль швейного производства в одном месте" />

      property="og:description"
      content="Заказы, склад, брак, сотрудники и финансы — всё в одной системе для швейных цехов Кыргызстана и СНГ. Без тетрадей и десяти Excel-файлов."
    />
    <meta property="og:image" content="https://tigim.vercel.app/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tigim — SaaS для управления швейным производством" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tigim — контроль швейного производства в одном месте" />
    <meta
      name="twitter:description"
      content="Заказы, склад, брак, сотрудники и финансы — всё в одной системе для швейных цехов СНГ."
    />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tigim",
        "url": "https://tigim.vercel.app/",
        "logo": "https://tigim.vercel.app/favicon.svg",
        "description": "SaaS для управления швейным производством в Кыргызстане и СНГ.",
        "areaServed": ["KG", "KZ", "RU", "UZ", "TJ"],
        "sameAs": ["https://github.com/kindybyte/tigim"]
      }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tigim",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://tigim.vercel.app/",
        "description": "Система контроля швейного производства: заказы, этапы, склад, брак, сотрудники, финансы и ИИ-помощник в одном месте.",
        "inLanguage": "ru",
        "offers": [
          {
            "@type": "Offer",
            "name": "Tigim Start",
            "price": "1500",
            "priceCurrency": "KGS",
            "availability": "https://schema.org/InStock"
          },
          {
            "@type": "Offer",
            "name": "Tigim Pro",
            "price": "5000",
            "priceCurrency": "KGS",
            "availability": "https://schema.org/InStock"
          },
          {
            "@type": "Offer",
            "name": "Tigim Factory",
            "price": "9000",
            "priceCurrency": "KGS",
            "availability": "https://schema.org/InStock"
          }
        ]
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
